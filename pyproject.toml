[project]
name = "nano-vllm-jax"
version = "0.1.0"
description = "A pedagogical JAX/CUDA continuous-batching text generation engine"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "jax>=0.4.30",
    "jaxlib>=0.4.30",
    "transformers>=4.44.0",
    "safetensors>=0.4.4",
    "numpy>=1.26.4",
    "sentencepiece>=0.2.0",
    "flask>=2.0.0",
    "PyYAML>=6.0.1",
    "xxhash>=3.0.0",
    "huggingface_hub>=0.20.0",
]

[project.optional-dependencies]
cuda13 = [
    "jax-cuda13-plugin[with-cuda]>=0.10.0; python_version >= '3.11'",
    "jax-cuda13-pjrt>=0.10.0; python_version >= '3.11'",
]
hf-parity = [
    "torch>=2.0.0",
]
progress = [
    "tqdm>=4.66.4",
]
flashinfer-ffi = [
    "flashinfer-python; python_version >= '3.11'",
    "jax-tvm-ffi; python_version >= '3.11'",
]
gdn-fla-triton = [
    "jax-triton==0.3.1; python_version >= '3.11'",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.11.0",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "UP006", "UP007"]

[tool.ruff.lint.per-file-ignores]
"tests/test_e2e_parity.py" = ["E402"]
"tests/test_gdn_segmented_reference.py" = ["E402"]
"tests/test_kv_cache.py" = ["E402"]
"tests/test_layer_parity.py" = ["E402"]
"tests/test_real_weight_layerwise_parity.py" = ["E402"]

[tool.ruff]
target-version = "py311"
line-length = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nanovllm_jax"]
