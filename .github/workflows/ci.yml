name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e . pytest ruff
      - name: Lint
        run: ruff check nanovllm_jax tests server.py
      - name: Test control plane
        env:
          JAX_PLATFORMS: cpu
        run: |
          pytest -q \
            tests/test_engine_initialization.py \
            tests/test_fastpath_config.py \
            tests/test_paged_attention_abi.py \
            tests/test_public_imports.py \
            tests/test_scheduler_capacity.py \
            tests/test_server_config.py \
            tests/test_service.py
