# Live, disposable MTP experiment configuration.
#
# Edit this file in place, then run:
#   .venv/bin/python benchmarks/benchmark_random_request_sidecar.py \
#     --experiment-config configs/diagnostics/mtp_live.yaml
#
# This is intentionally separate from the promoted server configuration.  The
# benchmark section drives the sidecar, while engine/runtime/kernels/env drive
# the JAX subprocess.  Keep the RAM watchdog enabled.

benchmark:
  model: "Qwen/Qwen3.5-4B"
  backend: "gpu"
  dtype: "bfloat16"
  weight_dtype: "bfloat16"
  jax_execution: "jit"
  skip_vllm: true
  skip_jax: false
  reference_json: "/mountpoint/.exp/diagnostics/nano-vllm-jax/mtp_backend_b1_20260711/qwen35_4b_no_mtp_current_b1_64x64_jax.json"
  run_label: "qwen35_4b_strict_k2_packed_weights_b1_64x64"
  output_json: "/mountpoint/.exp/diagnostics/nano-vllm-jax/mtp_backend_b1_20260711/qwen35_4b_strict_k2_packed_weights_b1_64x64.json"
  seed: 20260710
  dataset_name: "random"
  min_input_tokens: 64
  max_input_tokens: 64
  min_output_tokens: 64
  max_output_tokens: 64
  min_request_count: 1
  max_request_count: 1
  temperature: 0.0
  top_p: 1.0
  sampling_top_k: -1

  jax_warmup: true
  jax_warmup_mode: "generic"
  jax_fail_on_jit_cache_growth: true
  jax_profile: false
  jax_max_kv_cache_mb: 128
  jax_num_kvcache_blocks: 32
  max_num_seqs: 1
  max_num_resident_seqs: 1
  max_num_batched_tokens: 64
  jax_prefix_cache: true
  prefill_buckets: "64"
  prefill_token_buckets: "64"
  prefill_layout: "packed"
  batch_size_buckets: "1"
  max_blocks_per_seq: 8
  decode_block_table_buckets: "8"
  resident_decode_metadata: true
  jax_materialize_tied_lm_head: false
  jax_startup_warmup_prefill_token_buckets: "64"
  jax_startup_warmup_batch_size_buckets: "1"
  jax_startup_warmup_decode_block_table_buckets: "8"
  jax_startup_warmup_include_sampled_routes: false

  # Change these together with the matching engine fields below.
  jax_speculative_method: "mtp"
  jax_draft_sample_method: "greedy"
  jax_mtp_verifier_impl: "packed_prefix"
  jax_mtp_batch_accept_policy: "rowwise"
  jax_mtp_seed_after_bonus: true
  jax_mtp_bonus_margin: 0.0
  jax_mtp_draft_margin: 0.0
  jax_mtp_hidden_source: "final_normed"
  jax_mtp_chain_hidden_source: "final_normed"
  jax_mtp_chain_mode: "recursive"
  jax_mtp_token_source: "generated"
  jax_mtp_position_offset: 0
  jax_mtp_lm_head_greedy_top1_impl: "triton"
  jax_num_speculative_tokens: 2
  jax_mtp_burst_groups: 1
  jax_mtp_max_active_rows: 1
  jax_mtp_prefill_seed: true

  vllm_execution: "offline"
  vllm_max_model_len: 512
  vllm_gpu_memory_utilization: 0.72
  vllm_tensor_parallel_size: 1
  vllm_max_num_seqs: 1
  vllm_max_num_batched_tokens: 64
  vllm_cudagraph_capture_sizes: "1"
  vllm_language_model_only: true
  vllm_skip_mm_profiling: true
  vllm_enable_v1_multiprocessing: false
  vllm_use_flashinfer_sampler: false
  vllm_log_stats: false
  vllm_mode: "baseline"
  vllm_speculative_method: "mtp"
  vllm_num_speculative_tokens: 0

  command_timeout_seconds: 900
  max_system_ram_percent: 70
  worker_cpu_cores: 4
  worker_cpu_core_offset: 0
  worker_nice: 10
  resource_poll_seconds: 0.25

engine:
  model: "Qwen/Qwen3.5-4B"
  backend: "gpu"
  dtype: "bfloat16"
  weight_dtype: "bfloat16"
  jax_execution: "jit"
  prefill_buckets: "64"
  prefill_token_buckets: "64"
  prefill_layout: "packed"
  batch_size_buckets: "1"
  startup_warmup_prefill_token_buckets: "64"
  startup_warmup_batch_size_buckets: "1"
  startup_warmup_decode_block_table_buckets: "8"
  startup_warmup_include_sampled_routes: false
  decode_block_table_buckets: "8"
  max_prefill: 64
  max_kv_cache_mb: 128
  num_kvcache_blocks: 32
  max_num_seqs: 1
  max_num_resident_seqs: 1
  max_num_batched_tokens: 64
  max_blocks_per_seq: 8
  prefix_cache: true
  speculative_method: "mtp"
  draft_sample_method: "greedy"
  mtp_verifier_impl: "packed_prefix"
  mtp_batch_accept_policy: "rowwise"
  mtp_seed_after_bonus: true
  mtp_hidden_source: "final_normed"
  mtp_chain_hidden_source: "final_normed"
  mtp_chain_mode: "recursive"
  mtp_lm_head_greedy_top1_impl: "triton"
  num_speculative_tokens: 2
  mtp_burst_groups: 1
  mtp_max_active_rows: 1
  mtp_prefill_seed: true
  skip_compile: false

runtime:
  platform: "cuda"
  tokenizers_parallelism: false
  xla:
    preallocate: false
    gpu_allocator: "cuda_malloc_async"
    flags: "--xla_gpu_autotune_level=1 --xla_gpu_enable_triton_gemm=false"
  fastpaths:
    greedy_token: true
    sampled_token: true
    device_token_carry: true
    static_decode_metadata: true
    static_decode_seq_lens_carry: false
    resident_decode_metadata: true
    trace_token_prefetch: true
    materialize_tied_lm_head: false
    compact_prefill_in_proj_qkv: true
    compact_prefill_gdn_z: true
    compact_prefill_full_attn_proj: true
    compact_prefill_mlp: true
    compact_prefill_token_count_mode: "bucket"
    lm_head_decode_act_dtype: "bf16"
    lm_head_topk_impl: "jax"
    lm_head_greedy_top1_impl: "triton"
    decode_proj_act_dtype: "bf16"
    decode_padded_gemm: true
    decode_padded_gemm_gate_up: true
    decode_padded_gemm_rows: 8
    decode_padded_gemm_max_out_dim: 300000

kernels:
  backend: "pure_jax"
  allow_local_cuda_probes: false
  full_attention:
    kv_cache_dtype: "bf16"
    kv_append_impl: "reference"
    prefill_impl: "triton_packed"
    decode_impl: "flashinfer_paged"
  gdn:
    disable_fallbacks: true
    prefill_post_conv_impl: "triton_fla_padded"
    prefill_qkv_dtype: "fp32"
    prefill_post_conv_output_dtype: "fp32"
    prefill_block_dot: true
    packed_decode:
      impl: "reference"
      qkv_dtype: "bf16"

env:
  # Grouped B=1 decode consumes persistent packed projection leaves directly.
  NANO_VLLM_JAX_MTP_PACKED_PROJECTIONS: "1"
  # Broad verifier projections; norms remain width-1 for numerical stability.
  NANO_VLLM_JAX_FORCE_WIDTH1_DECODE_MATH: "0"
  NANO_VLLM_JAX_FORCE_WIDTH1_DECODE_NORMS: "1"
  NANO_VLLM_JAX_FORCE_WIDTH1_GDN_INPUT_PROJECTIONS: "0"
  NANO_VLLM_JAX_FORCE_WIDTH1_GDN_OUTPUT_PROJECTIONS: "0"
  NANO_VLLM_JAX_FORCE_WIDTH1_FULL_ATTN_PROJECTIONS: "0"
  NANO_VLLM_JAX_FORCE_WIDTH1_MLP_PROJECTIONS: "0"
  NANO_VLLM_JAX_GDN_DECODE_PREFIX_STATE_IMPL: "kernel"
  NANO_VLLM_JAX_FULL_ATTN_RECTANGULAR_DECODE_IMPL: "kernel"
  NANO_VLLM_JAX_FLASHINFER_PAGE_TABLE_IMPL: "dense"
  NANO_VLLM_JAX_MTP_TABLE_TARGET_MODE: "decode_rectangular"
  NANO_VLLM_JAX_MANIFEST_WARMUP_EXPAND_DECODE_ROWS: "0"
  # Keep short tails scheduler-gated instead of compiling another large shape.
  NANO_VLLM_JAX_MTP_FIXED_K_NO_BONUS_TAIL: "0"
  NANO_VLLM_JAX_MANIFEST_WARMUP_MTP_TABLE_SAFETY_NO_BONUS: "0"
